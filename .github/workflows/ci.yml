name: Fruit Shop API CI

# Runs on every push and pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fruit_shop2.0

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # The test classes end in "Testing", which Maven skips by default,
      # so -Dtest tells it to run them.
      - name: Build and run unit tests
        run: mvn -B verify -Dtest='*Testing'